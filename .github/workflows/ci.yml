name: CI — Lint, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npm run validate:extension-manifest

      - name: Type check (engine)
        run: npx tsc --noEmit

      - name: Type check (extension)
        run: npx tsc -p tsconfig.ext.json --noEmit

      - name: Run tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --ci --coverage

      - name: Build extension
        run: node esbuild.config.mjs

      - name: Validate built manifest
        run: node scripts/validate-extension-manifest.mjs dist/manifest.json

      - name: Verify dist output
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/content.js
          test -f dist/popup/popup.html
          test -f dist/options/options.html
          test -f dist/sidepanel/sidepanel.html

      - name: Package extension
        run: cd dist && zip -r ../prompt-compiler.zip . -x "*.map"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-compiler-extension
          path: prompt-compiler.zip
          retention-days: 30
